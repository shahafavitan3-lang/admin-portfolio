<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Shahaf Admin
</title>


<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


</head>


<body>



<!-- LOGIN -->


<section class="login" id="login">


<div class="login-card">


<h1>
Shahaf<span>.</span>
</h1>


<p>
Private Admin Area
</p>



<input

id="password"

type="password"

placeholder="Enter password"

>



<button id="loginBtn">

Login

</button>



<div id="error"></div>


</div>


</section>








<!-- DASHBOARD -->


<section class="dashboard hidden" id="dashboard">



<aside>


<h2>
Shahaf<span>.</span>
</h2>


<p>
Admin Panel
</p>



<button id="logout">

Logout

</button>


</aside>







<main>


<header>


<h1>
Contact Requests
</h1>


<p>
Manage messages from visitors
</p>


</header>







<div class="stats">


<div>

<h2 id="total">
0
</h2>

<p>
Total
</p>

</div>



<div>

<h2 id="new">
0
</h2>

<p>
New
</p>

</div>



<div>

<h2 id="done">
0
</h2>

<p>
Done
</p>

</div>


</div>








<div class="tools">


<input

id="search"

placeholder="Search..."

>


<select id="filter">


<option value="all">
All
</option>


<option value="New">
New
</option>


<option value="Done">
Done
</option>


</select>


</div>






<div id="messages"></div>






<button id="deleteAll">

Delete All Messages

</button>



</main>




</section>






<script src="admin.js"></script>


</body>

</html>
